# Render service definitions.
#
# Three services: IHS, IIHS, and the shared editor API.
# The database, auth, and image storage are on Supabase's free tier.
#
# The API is on a paid instance deliberately. The free tier sleeps after
# 15 minutes and takes ~50 seconds to wake, which is fine for visitors
# (they read a static content.json and never call this API) but would
# make signing in to edit painfully slow.

services:
  # ---------------------------------------------------------------
  # Editor API
  # ---------------------------------------------------------------
  - type: web
    name: ihcs-editor-api
    runtime: node
    plan: starter          # $7/month, always on
    region: ohio
    rootDir: ihcs-editor-api
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false        # set in the Render dashboard
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false        # secret — never commit
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: DATABASE_URL
        sync: false        # secret
      - key: SUPABASE_STORAGE_BUCKET
        value: site-images
      - key: ALLOWED_ORIGINS
        sync: false        # e.g. https://innovationhealthcaresolutions.com
      - key: RENDER_DEPLOY_HOOK_URL
        sync: false        # deploy hook for the static site below
      - key: RENDER_SCHOOL_DEPLOY_HOOK_URL
        sync: false        # deploy hook for the IIHS static site

  # ---------------------------------------------------------------
  # Public website (unchanged apart from the content fetch at build)
  # ---------------------------------------------------------------
  - type: web
    name: ihcs-site
    runtime: static
    rootDir: IHCS-REACT_SITE_REDESIGN
    buildCommand: npm ci && npm run build:ihs
    staticPublishPath: ./dist
    envVars:
      - key: VITE_SCHOOL_SITE_URL
        sync: false        # actual IIHS Render URL, then purchased domain
      - key: VITE_EDITOR_API_URL
        sync: false        # https://ihcs-editor-api.onrender.com
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false        # publishable by design; RLS is the protection
    routes:
      # SPA fallback so deep links like /courses/med-tech resolve.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # content.json must never be cached hard, or a publish would not
      # appear until the CDN entry expired.
      - path: /content.json
        name: Cache-Control
        value: no-cache, must-revalidate

  # School preview works with its Render URL before a domain is purchased.
  - type: web
    name: iihs-school
    runtime: static
    rootDir: IHCS-REACT_SITE_REDESIGN
    buildCommand: npm ci && npm run build:school
    staticPublishPath: ./dist-school
    envVars:
      - key: VITE_IHS_SITE_URL
        value: https://innovationhealthcaresolutions.com
      - key: VITE_EDITOR_API_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /content.json
        name: Cache-Control
        value: no-cache, must-revalidate
